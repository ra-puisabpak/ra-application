<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA / CAPA — Puisabpak</title>
<style>
:root{--nav:#102a45;--bg:#f4f7fb;--line:#dfe6ef;--text:#23364a;--muted:#738196;--green:#31a96b;--red:#e35d62;--blue:#2f8fe8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Thai",system-ui,sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:5}.top b{font-size:17px}.wrap{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}.title{font-weight:800;margin-bottom:9px}.muted{color:var(--muted);font-size:12px}.btn{border:0;background:#173b61;color:#fff;border-radius:7px;padding:9px 11px;font-weight:750;cursor:pointer}.btn.secondary{background:#eef3f8;color:#29425b}.btn.danger{background:#a8323b}.form{display:grid;gap:8px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit}.form textarea{min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.error{background:#fde8e8;color:#9e3030;padding:9px;border-radius:7px;margin:8px 0}.ok{background:#e7f5ed;color:#317a50;padding:9px;border-radius:7px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:12px}.btn{min-height:40px}.actions .btn{flex:1;min-width:120px}.row>*{width:100%}.row .btn{width:auto;flex:1}}
</style></head><body>
<header class="top"><b>🛡️ QA / CAPA</b><button class="btn secondary" onclick="location.href='/'">กลับ Dashboard</button></header>
<main class="wrap">
<div id="msg"></div>
<div class="grid">
<section class="card"><div class="title">สร้าง Nonconformity (NC)</div><form id="ncForm" class="form">
<select id="ncSource"><option>INTERNAL_AUDIT</option><option>REGULATORY_AUDIT</option><option>FDA_QUERY</option><option>CUSTOMER_COMPLAINT</option><option>SUPPLIER</option><option>DATA_INTEGRITY</option><option>LABEL_REVIEW</option><option>PROCESS</option><option>PRODUCT</option><option>OTHER</option></select>
<input id="ncTitle" placeholder="หัวข้อ NC" required><textarea id="ncDescription" placeholder="รายละเอียดข้อบกพร่อง" required></textarea>
<select id="ncSeverity"><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select>
<input id="ncOwner" placeholder="Owner ID / ผู้รับผิดชอบ" required><input id="ncDue" type="date" required>
<button class="btn">บันทึก NC</button></form></section>
<section class="card"><div class="title">สร้าง CAPA จาก NC</div><p class="muted">เลือก NC ที่ยังไม่มี CAPA แล้วกำหนด Owner</p><div class="form"><select id="capaNc"></select><input id="capaOwner" placeholder="Owner ID / ผู้รับผิดชอบ"><button class="btn" onclick="createCapa()">สร้าง CAPA</button></div></section>
</div>
<section class="card"><div class="row"><div><div class="title">Nonconformity Register</div><div class="muted">ติดตามแหล่งที่มา สถานะ ความรุนแรง และกำหนดดำเนินการ</div></div><button class="btn secondary" onclick="loadAll()">Refresh</button></div><div id="ncs"></div></section>
<section class="card"><div class="title">CAPA Register</div><div id="capas"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(path,opt={}){const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j?.error?.message||'Request failed');return j}
function msg(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'ok':'error')+'">'+esc(t)+'</div>'}
async function loadAll(){try{const [n,c]=await Promise.all([api('/qa/nonconformities'),api('/qa/capas')]);renderNC(n.data||[]);renderCAPA(c.data||[]);$('capaNc').innerHTML=(n.data||[]).filter(x=>x.status!=='CONVERTED_TO_CAPA').map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+' — '+esc(x.severity)+'</option>').join('')||'<option value="">ไม่มี NC สำหรับสร้าง CAPA</option>'}catch(e){msg(e.message)}}
function renderNC(rows){$('ncs').innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.title)+'</b> <span class="badge">'+esc(x.severity)+'</span> <span class="badge">'+esc(x.status)+'</span><div class="muted">'+esc(x.source)+' · Owner: '+esc(x.owner_id)+' · Due: '+esc(x.due_date)+'</div><div class="actions"><button class="btn secondary" onclick="ncStatus(\''+esc(x.id)+'\',\'UNDER_REVIEW\')">เริ่มทบทวน</button><button class="btn secondary" onclick="ncStatus(\''+esc(x.id)+'\',\'CLOSED\')">ปิด NC</button></div></div>').join(''):'<p class="muted">ยังไม่มี NC</p>'}
async function ncStatus(id,status){try{await api('/qa/nonconformities/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});await loadAll()}catch(e){msg(e.message)}}
async function createCapa(){const nc=$('capaNc').value,owner=$('capaOwner').value.trim();if(!nc||!owner)return msg('กรุณาระบุ NC และ Owner');try{await api('/qa/capas',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nonconformity_id:nc,owner_id:owner})});msg('สร้าง CAPA แล้ว',true);await loadAll()}catch(e){msg(e.message)}}
function renderCAPA(rows){$('capas').innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.nonconformity_title)+'</b> <span class="badge">'+esc(x.status)+'</span><div class="muted">CAPA: '+esc(x.id)+' · Severity: '+esc(x.nonconformity_severity)+' · Owner: '+esc(x.owner_id)+'</div><div class="actions"><button class="btn secondary" onclick="openCapa(\''+esc(x.id)+'\')">เปิดรายละเอียด / Actions</button></div><div id="capa-'+esc(x.id)+'"></div></div>').join(''):'<p class="muted">ยังไม่มี CAPA</p>'}
async function openCapa(id){try{const r=await api('/qa/capas/'+encodeURIComponent(id));const x=r.data;const actions=x.actions||[];$('capa-'+id).innerHTML='<div class="card"><div class="form"><select id="st-'+id+'"><option>OPEN</option><option>ROOT_CAUSE_ANALYSIS</option><option>ACTION_PLANNING</option><option>IMPLEMENTATION</option><option>EFFECTIVENESS_CHECK</option><option>REJECTED</option></select><input id="rcm-'+id+'" placeholder="Root cause method เช่น 5WHY / FISHBONE"><textarea id="rc-'+id+'" placeholder="Root cause">'+esc(x.root_cause||'')+'</textarea><textarea id="cont-'+id+'" placeholder="Containment / Correction">'+esc(x.containment||'')+'</textarea><textarea id="ec-'+id+'" placeholder="Effectiveness criteria">'+esc(x.effectiveness_criteria||'')+'</textarea><input id="vb-'+id+'" placeholder="Verified by">'+esc(x.verified_by||'')+'</input><button class="btn" onclick="updateCapa(\''+id+'\')">บันทึก CAPA</button></div><hr><div class="title">Actions</div>'+actions.map(a=>'<div class="item">'+esc(a.type)+' — '+esc(a.description)+' <span class="badge">'+esc(a.status)+'</span><div class="actions">'+(a.status!=='COMPLETED'?'<button class="btn secondary" onclick="completeAction(\''+esc(a.id)+'\')">Mark completed</button>':'')+'</div></div>').join('')+'<div class="form" style="margin-top:8px"><select id="at-'+id+'"><option>CORRECTION</option><option>CORRECTIVE_ACTION</option><option>PREVENTIVE_ACTION</option></select><input id="ad-'+id+'" placeholder="รายละเอียด Action"><input id="ao-'+id+'" placeholder="Action Owner ID"><input id="due-'+id+'" type="date"><button class="btn secondary" onclick="addAction(\''+id+'\')">เพิ่ม Action</button></div><button class="btn danger" style="margin-top:8px" onclick="closeCapa(\''+id+'\')">ปิด CAPA</button></div>'}catch(e){msg(e.message)}}
async function updateCapa(id){try{await api('/qa/capas/'+encodeURIComponent(id)+'/update',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:$('st-'+id).value,root_cause_method:$('rcm-'+id).value,root_cause:$('rc-'+id).value,containment:$('cont-'+id).value,effectiveness_criteria:$('ec-'+id).value,verified_by:$('vb-'+id).value,verified_at:$('vb-'+id).value?new Date().toISOString():null})});msg('บันทึก CAPA แล้ว',true);await loadAll()}catch(e){msg(e.message)}}
async function addAction(id){try{await api('/qa/capas/'+encodeURIComponent(id)+'/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:$('at-'+id).value,description:$('ad-'+id).value,owner_id:$('ao-'+id).value,due_date:$('due-'+id).value})});await openCapa(id)}catch(e){msg(e.message)}}
async function completeAction(id){try{await api('/qa/capa-actions/'+encodeURIComponent(id)+'/update',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:'COMPLETED'})});await loadAll()}catch(e){msg(e.message)}}
async function closeCapa(id){try{await api('/qa/capas/'+encodeURIComponent(id)+'/close',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});msg('ปิด CAPA แล้ว',true);await loadAll()}catch(e){msg(e.message)}}
$('ncForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/qa/nonconformities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:$('ncSource').value,title:$('ncTitle').value,description:$('ncDescription').value,severity:$('ncSeverity').value,owner_id:$('ncOwner').value,due_date:$('ncDue').value})});e.target.reset();msg('บันทึก NC แล้ว',true);await loadAll()}catch(x){msg(x.message)}});
loadAll();
</script></body></html>
