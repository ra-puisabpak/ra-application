<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production & QC — Puisabpak</title><style>:root{--nav:#102a45;--bg:#f4f7fb;--line:#dfe6ef;--text:#23364a;--muted:#738196;--green:#31a96b;--red:#e35d62;--blue:#2f8fe8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Thai",system-ui,sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:5}.wrap{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}.title{font-weight:800;margin-bottom:9px}.muted{color:var(--muted);font-size:12px}.btn{border:0;background:#173b61;color:#fff;border-radius:7px;padding:9px 11px;font-weight:750;cursor:pointer}.btn.secondary{background:#eef3f8;color:#29425b}.btn.danger{background:#a8323b}.form{display:grid;gap:8px}.form input,.form select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:10px;font-weight:800}.pass{background:#e5f5ed;color:#16724a}.fail{background:#fde8e8;color:#b23a3a}.hold{background:#fff2d9;color:#a56600}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.error{background:#fde8e8;color:#9e3030;padding:9px;border-radius:7px;margin:8px 0}.ok{background:#e7f5ed;color:#317a50;padding:9px;border-radius:7px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:12px}.btn{min-height:40px}.actions .btn{flex:1;min-width:120px}.row>*{width:100%}.row .btn{width:auto;flex:1}}</style></head><body><header class="top"><b>🏭 Production & QC</b><button class="btn secondary" onclick="location.href='/'">กลับ Dashboard</button></header><main class="wrap"><div id="msg"></div><div class="grid"><section class="card"><div class="title">เปิด Production Batch</div><form id="batchForm" class="form"><input id="product" placeholder="Product ID" required><input id="lot" placeholder="Batch / Lot" required><input id="date" type="date" required><button class="btn">สร้าง Batch</button></form></section><section class="card"><div class="title">บันทึก QC Check</div><div class="form"><select id="batchQc"></select><select id="type"><option>INCOMING</option><option>IN_PROCESS</option><option>FINISHED_PRODUCT</option></select><input id="param" placeholder="Parameter / รายการตรวจ" required><input id="spec" placeholder="Specification (ถ้ามีในเอกสาร)" ><input id="result" placeholder="Result value"><select id="status"><option>PENDING</option><option>PASS</option><option>FAIL</option><option>N_A</option><option>HOLD</option></select><button class="btn" onclick="addQC()">บันทึก QC</button></div></section></div><section class="card"><div class="row"><div><div class="title">Production Batch Register</div><div class="muted">ไม่กำหนด Critical Limit อัตโนมัติ — Specification ใส่ได้เมื่อมีแหล่งอ้างอิง</div></div><button class="btn secondary" onclick="load()">Refresh</button></div><div id="batches"></div></section></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function api(p,o={}){const r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j}function msg(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'ok':'error')+'">'+esc(t)+'</div>'}async function load(){try{const r=await api('/production/batches');const rows=r.data||[];$('batchQc').innerHTML=rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.product_id)+' · '+esc(x.batch_lot)+'</option>').join('')||'<option value="">ยังไม่มี Batch</option>';render(rows)}catch(e){msg(e.message)}}function render(rows){$('batches').innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.product_id)+' · '+esc(x.batch_lot)+'</b> <span class="badge">'+esc(x.status)+'</span><div class="muted">Production date: '+esc(x.production_date)+' · Created by: '+esc(x.created_by)+'</div><div class="actions"><button class="btn secondary" onclick="detail(\''+esc(x.id)+'\')">รายละเอียด / QC</button><button class="btn" onclick="release(\''+esc(x.id)+'\',\'HOLD\')">HOLD</button><button class="btn" onclick="release(\''+esc(x.id)+'\',\'RELEASE\')">QA RELEASE</button></div><div id="d-'+esc(x.id)+'"></div></div>').join(''):'<p class="muted">ยังไม่มี Production Batch</p>'}async function detail(id){try{const r=await api('/production/batches/'+encodeURIComponent(id));const x=r.data;const q=x.qc||[];$('d-'+id).innerHTML='<div class="card"><div class="title">QC Records</div>'+q.map(a=>'<div class="item">'+esc(a.check_type)+' · <b>'+esc(a.parameter)+'</b> '+badge(a.result_status)+'<div class="muted">Spec: '+esc(a.specification||'—')+' · Result: '+esc(a.result_value||'—')+' · By: '+esc(a.checked_by)+'</div></div>').join('')+'<div class="title" style="margin-top:10px">Process Records</div>'+((x.process||[]).map(a=>'<div class="item">'+esc(a.step_name)+' · '+esc(a.observed_value||'')+' '+esc(a.unit||'')+'<div class="muted">Operator: '+esc(a.operator_id)+'</div></div>').join('')||'<p class="muted">ยังไม่มี</p>')+'</div>'}catch(e){msg(e.message)}}function badge(s){let c=s==='PASS'?'pass':s==='FAIL'?'fail':s==='HOLD'?'hold':'';return '<span class="badge '+c+'">'+esc(s)+'</span>'}async function addQC(){try{const b=$('batchQc').value;if(!b)return msg('ยังไม่มี Batch');await api('/production/batches/'+encodeURIComponent(b)+'/qc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({check_type:$('type').value,parameter:$('param').value,specification:$('spec').value,result_value:$('result').value,result_status:$('status').value})});msg('บันทึก QC แล้ว',true);await load()}catch(e){msg(e.message)}}async function release(id,decision){try{await api('/production/batches/'+encodeURIComponent(id)+'/release',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision,reason:decision==='HOLD'?'QA hold decision':''})});msg('บันทึก '+decision+' แล้ว',true);await load()}catch(e){msg(e.message)}}$('batchForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/production/batches',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product_id:$('product').value,batch_lot:$('lot').value,production_date:$('date').value})});e.target.reset();msg('สร้าง Batch แล้ว',true);await load()}catch(x){msg(x.message)}});load();</script></body></html>
