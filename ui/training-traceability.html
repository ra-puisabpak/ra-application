<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training & Traceability — Puisabpak</title><style>:root{--bg:#f4f7fb;--line:#dfe6ef;--text:#23364a;--muted:#738196}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Thai",system-ui,sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:5}.wrap{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}.title{font-weight:800;margin-bottom:9px}.muted{color:var(--muted);font-size:12px}.btn{border:0;background:#173b61;color:#fff;border-radius:7px;padding:9px 11px;font-weight:750}.btn.secondary{background:#eef3f8;color:#29425b}.form{display:grid;gap:8px}.form input,.form select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit}.item{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.ok{background:#e7f5ed;color:#317a50;padding:8px;border-radius:7px}.err{background:#fde8e8;color:#9e3030;padding:8px;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.btn{min-height:40px}.actions .btn{flex:1}}
</style></head><body><header class="top"><b>📚 Training & Traceability</b><button class="btn secondary" onclick="location.href='/'">กลับ Dashboard</button></header><main class="wrap"><div id="msg"></div><div class="grid"><section class="card"><div class="title">Training Requirement</div><div class="form"><select id="tt"><option>DOCUMENT_REVISION</option><option>REGULATORY_CHANGE</option><option>PROCESS_CHANGE</option><option>ROLE_COMPETENCY</option><option>CAPA</option></select><input id="ts" placeholder="Source Record ID"><input id="tr" placeholder="Role IDs เช่น QA,DCC"><input id="td" type="date"><button class="btn" onclick="addTraining()">สร้าง Requirement</button></div></section><section class="card"><div class="title">Traceability Event</div><div class="form"><select id="et"><option>RECEIPT</option><option>PRODUCTION</option><option>PACKING</option><option>RELEASE</option><option>DISTRIBUTION</option><option>HOLD</option><option>WITHDRAWAL</option><option>RECALL</option></select><input id="ef" placeholder="From ID"><input id="eto" placeholder="To ID"><input id="ed" type="date"><button class="btn" onclick="addEvent()">บันทึก Event</button></div></section></div><section class="card"><div class="row"><div class="title">Training & Competency</div><button class="btn secondary" onclick="load()">Refresh</button></div><div id="training"></div></section><section class="card"><div class="title">Traceability Register</div><div id="events"></div></section><section class="card"><div class="title">Recall Cases</div><div class="form"><input id="rp" placeholder="Product ID"><input id="rr" placeholder="Reason"><button class="btn" onclick="addRecall()">เปิด Recall Case</button></div><div id="recalls"></div></section></main><script>const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function api(p,o={}){const r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Request failed');return j}function msg(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'ok':'err')+'">'+esc(t)+'</div>'}async function load(){try{const [t,e,r]=await Promise.all([api('/training/requirements'),api('/traceability/events'),api('/recalls')]);$('training').innerHTML=(t.data||[]).map(x=>'<div class="item"><b>'+esc(x.type)+'</b> · '+esc(x.source_record_id)+' <span class="badge">'+esc(x.status)+'</span><div class="muted">Roles: '+esc(x.role_ids_json)+' · Required by: '+esc(x.required_by||'—')+'</div><div class="actions">'+(!['COMPLETED','WAIVED'].includes(x.status)?'<button class="btn secondary" onclick="completeTraining(\''+esc(x.id)+'\')">Completed</button>':'')+'</div></div>').join('')||'<p class="muted">ยังไม่มี Requirement</p>';$('events').innerHTML=(e.data||[]).map(x=>'<div class="item"><b>'+esc(x.event_type)+'</b> · '+esc(x.from_id||'—')+' → '+esc(x.to_id||'—')+'<div class="muted">'+esc(x.event_date)+' · Evidence: '+esc(x.evidence_ids_json||'—')+'</div></div>').join('')||'<p class="muted">ยังไม่มี Event</p>';$('recalls').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.product_id)+'</b> <span class="badge">'+esc(x.status)+'</span><div class="muted">'+esc(x.reason)+'</div><div class="actions"><button class="btn secondary" onclick="recallStatus(\''+esc(x.id)+'\',\'ASSESSMENT\')">Assessment</button><button class="btn secondary" onclick="recallStatus(\''+esc(x.id)+'\',\'ACTION\')">Action</button><button class="btn secondary" onclick="recallStatus(\''+esc(x.id)+'\',\'VERIFICATION\')">Verification</button><button class="btn secondary" onclick="recallStatus(\''+esc(x.id)+'\',\'CLOSED\')">Close</button></div></div>').join('')||'<p class="muted">ยังไม่มี Recall</p>'}catch(e){msg(e.message)}}async function addTraining(){try{await api('/training/requirements',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:$('tt').value,source_record_id:$('ts').value,role_ids_json:$('tr').value,required_by:$('td').value})});msg('สร้าง Training Requirement แล้ว',true);load()}catch(e){msg(e.message)}}async function completeTraining(id){const evidenceId=prompt('ระบุ Evidence ID ที่ใช้ยืนยันการอบรม (ต้องมีหลักฐานจริง)');if(!evidenceId||!evidenceId.trim())return;try{await api('/training/requirements/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:'COMPLETED',completion_evidence_ids_json:JSON.stringify([evidenceId.trim()])})});msg('บันทึกการอบรมเป็น Completed พร้อม Evidence แล้ว',true);load()}catch(e){msg(e.message)}}async function addEvent(){try{await api('/traceability/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event_type:$('et').value,from_type:'NODE',from_id:$('ef').value,to_type:'NODE',to_id:$('eto').value,event_date:$('ed').value})});msg('บันทึก Traceability Event แล้ว',true);load()}catch(e){msg(e.message)}}async function addRecall(){try{await api('/recalls',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product_id:$('rp').value,reason:$('rr').value})});msg('เปิด Recall Case แล้ว',true);load()}catch(e){msg(e.message)}}async function recallStatus(id,status){try{await api('/recalls/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});load()}catch(e){msg(e.message)}}load()</script></body></html>
