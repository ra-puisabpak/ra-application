<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports & Analytics — Puisabpak</title><style>body{margin:0;background:#f4f7fb;color:#23364a;font-family:Inter,"Noto Sans Thai",system-ui}.top{height:58px;background:#fff;border-bottom:1px solid #dfe6ef;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0}.wrap{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:11px;padding:14px;margin-bottom:12px}.num{font-size:27px;font-weight:850}.muted{color:#738196;font-size:12px}.btn{border:0;background:#173b61;color:#fff;border-radius:7px;padding:9px 11px;font-weight:750}.btn.secondary{background:#eef3f8;color:#29425b}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e7edf3}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}.item{display:block}.item strong{display:block;margin-top:4px}}</style></head><body><header class="top"><b>📊 Reports & Analytics</b><button class="btn secondary" onclick="location.href='/'">กลับ Dashboard</button></header><main class="wrap"><div class="row"><div><h1>Management Reports</h1><p class="muted">ข้อมูลจาก D1 แบบ read-only สำหรับติดตามระบบ</p></div><button class="btn" onclick="load()">Refresh</button></div><div id="cards" class="grid"></div><section class="card"><h3>Operational Summary</h3><div id="summary"></div></section></main><script>async function load(){const r=await fetch('/dashboard');const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Failed');const d=j.data;const cards=[['Documents',d.documents?.total??0,'Controlled '+(d.documents?.controlled??0)],['Products',d.productSummary?.total??0,'Effective '+(d.productSummary?.effective??0)],['Production Batches',d.production?.total??0,'Open '+(d.production?.open??0)],['QC Checks',d.qc?.total??0,'Failed '+(d.qc?.failed??0)],['CAPA',d.capa?.total??0,'Open '+(d.capa?.open??0)],['Training',d.training?.total??0,'Open '+(d.training?.open??0)],['Traceability Events',d.traceability?.total??0,'Recorded events'],['Recall Cases',d.recalls?.total??0,'Open '+(d.recalls?.open??0)],['Pending Approvals',d.pendingApprovals??0,'My approval queue']];document.getElementById('cards').innerHTML=cards.map(x=>'<div class="card"><div class="num">'+x[1]+'</div><b>'+x[0]+'</b><div class="muted">'+x[2]+'</div></div>').join('');document.getElementById('summary').innerHTML='<div class="item"><span>QC pending</span><strong>'+ (d.qc?.pending??0) +'</strong></div><div class="item"><span>QC failed</span><strong>'+ (d.qc?.failed??0) +'</strong></div><div class="item"><span>Open CAPA</span><strong>'+ (d.capa?.open??0) +'</strong></div><div class="item"><span>Open Recall</span><strong>'+ (d.recalls?.open??0) +'</strong></div><div class="item"><span>Training open</span><strong>'+ (d.training?.open??0) +'</strong></div>'}load().catch(e=>document.getElementById('summary').textContent=e.message)</script></body></html>
