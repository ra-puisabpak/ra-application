name: Deploy Puisabpak Regulatory

on:
  push:
    branches:
      - deploy/puisabpak-regulatory
    paths:
      - regulatory/**
      - .github/workflows/deploy-regulatory.yml

concurrency:
  group: cloudflare-puisabpak-regulatory
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: regulatory
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: cp worker.js /tmp/worker.mjs && node --check /tmp/worker.mjs

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
